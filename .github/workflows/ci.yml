# CI — typecheck and test on the three platforms this server supports.
#
# The OS matrix is the point: phase 3 explicitly targeted Linux, macOS and
# Windows, and the failure modes we have hit are platform-specific (POSIX
# permission bits vs Windows ACLs, CRLF line endings on STDIO, per-OS cache
# directories). Node is pinned to 20 because engines requires >= 20 and the
# code uses no newer API, so a second major would double the minutes for little
# extra signal.
#
# pnpm has no "packageManager" field in package.json, so the version is pinned
# here; lockfileVersion is 9.0, which pnpm 9, 10 and 11 all write.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
