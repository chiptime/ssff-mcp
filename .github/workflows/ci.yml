# CI — typecheck and test on the three platforms this server supports.
#
# The OS matrix is the point: phase 3 explicitly targeted Linux, macOS and
# Windows, and the failure modes we have hit are platform-specific (POSIX
# permission bits vs Windows ACLs, CRLF line endings on STDIO, per-OS cache
# directories). Node 20 is the engines floor and runs on every OS; a single
# Linux job on Node 22 covers the tests that need a newer test-only API.
#
# pnpm has no "packageManager" field in package.json, so the version is pinned
# here; lockfileVersion is 9.0, which pnpm 9, 10 and 11 all write. It must be
# pnpm 10: pnpm 11 requires Node >= 22.13 and fails to start on this Node 20
# matrix (ERR_UNKNOWN_BUILTIN_MODULE node:sqlite).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
        # One extra Linux job on Node 22: tests that need module.registerHooks
        # (Node >= 22.15) skip on Node 20 and must still run somewhere.
        include:
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
